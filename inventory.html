<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0b0a09">
  <title>Inventori | GEMBUL Studio</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:dark;--bg:#0b0a09;--panel:#1a1713;--gold:#d4a86a;--text:#f5efe6;--muted:#a39a8c;--line:#342e26;--danger:#ffb5a8}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 Poppins,system-ui,sans-serif}a{color:var(--gold);text-decoration:none}
    header{display:flex;justify-content:space-between;align-items:center;padding:16px max(18px,calc((100vw - 1060px)/2));border-bottom:1px solid var(--line)}nav{display:flex;gap:14px;align-items:center;font-size:12px}
    .brand,h1,h2{font-family:Syne,sans-serif}.brand{font-weight:800;letter-spacing:.18em}main{width:min(1060px,calc(100% - 28px));margin:28px auto 70px}
    h1{font-size:clamp(28px,5vw,38px);margin:5px 0}.eyebrow{color:var(--gold);font-size:11px;letter-spacing:.18em}.panel{padding:18px;border:1px solid var(--line);border-radius:16px;background:var(--panel);margin:14px 0}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.metric,.card{padding:14px;border:1px solid var(--line);border-radius:12px;background:#100e0c}
    .metric small,.muted{display:block;color:var(--muted);font-size:12px}.metric strong{display:block;margin-top:6px;font:700 20px Syne,sans-serif}
    label{display:grid;gap:5px;color:var(--muted);font-size:12px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--text)}textarea{min-height:65px}
    .button{padding:10px 14px;border:1px solid #8a653d;border-radius:9px;background:#21190f;color:var(--gold);font-weight:600;cursor:pointer}.row{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.row>*{flex:1}
    .status{min-height:22px;color:var(--muted);font-size:13px}.error{color:var(--danger)!important}.low{color:#ffb5a8}.list{display:grid;gap:8px}.item{padding:11px;border:1px solid var(--line);border-radius:10px;background:#100e0c}.item strong{display:block}.item small{color:var(--muted)}[hidden]{display:none!important}
    @media(max-width:600px){header{align-items:flex-start}nav{justify-content:flex-end;flex-wrap:wrap}.row>*{flex-basis:100%}}
  </style>
</head>
<body>
  <header><a class="brand" href="/">GEMBUL</a><nav><a href="/admin.html">Dashboard</a><a href="/pos.html">Kasir</a><a href="/customers.html">Pelanggan</a><button class="button" id="logout" type="button">Keluar</button></nav></header>
  <main><div class="eyebrow">STOK · PEMBELIAN · PERGERAKAN BARANG</div><h1>Inventori</h1><p id="status" class="status" role="status" aria-live="polite">Memeriksa akses...</p>
    <section id="inventory" hidden>
      <div class="panel"><div class="metrics"><article class="metric"><small>Produk aktif</small><strong id="product-count">-</strong></article><article class="metric"><small>Nilai stok berdasarkan modal</small><strong id="inventory-value">-</strong></article><article class="metric"><small>Perlu restock</small><strong id="low-count">-</strong></article></div></div>
      <section class="panel"><h2>Produk &amp; stok minimum</h2><div class="list" id="products"></div></section>
      <section class="panel" id="product-panel" hidden><h2>Tambah / ubah produk (Super Admin)</h2><form id="product-form" class="grid">
        <input type="hidden" name="id"><label>Nama<input name="name" required minlength="2" maxlength="100"></label><label>SKU<input name="sku" maxlength="60"></label><label>Kategori<input name="category" value="Umum" maxlength="60"></label><label>Satuan<input name="unit" value="pcs" maxlength="20"></label><label>Harga modal (Rp)<input name="purchase_price" type="number" min="0" step="1" required></label><label>Harga jual (Rp)<input name="selling_price" type="number" min="0" step="1" required></label><label>Stok minimum<input name="minimum_stock" type="number" min="0" step="1" value="0" required></label><label>Status<select name="is_active"><option value="true">Aktif</option><option value="false">Nonaktif</option></select></label><button class="button" type="submit">Simpan produk</button>
      </form><button class="button" id="new-product" type="button" style="margin-top:10px">Form produk baru</button></section>
      <div class="grid">
        <section class="panel"><h2>Penerimaan pembelian</h2><form id="purchase-form" class="grid">
          <label>Pemasok<select id="supplier-select"><option value="">Tanpa pemasok</option></select></label><label>Produk<select id="purchase-product" required></select></label><label>Jumlah diterima<input name="quantity" type="number" min="1" max="10000" value="1" required></label><label>Harga modal / unit<input name="unit_cost" type="number" min="0" step="1" required></label><label>Catatan<textarea name="notes" maxlength="500"></textarea></label><button class="button" type="submit">Catat pembelian &amp; tambah stok</button>
        </form></section>
        <section class="panel"><h2>Penyesuaian stok</h2><form id="adjust-form" class="grid">
          <label>Produk<select id="adjust-product" required></select></label><label>Pergerakan<select name="type"><option value="adjustment">Koreksi stok</option><option value="damaged">Rusak</option><option value="expired">Kedaluwarsa</option></select></label><label>Jumlah perubahan (+/-)<input name="quantity" type="number" step="1" required></label><label>Catatan<input name="note" maxlength="500" required></label><button class="button" type="submit">Simpan perubahan stok</button>
        </form></section>
      </div>
      <section class="panel" id="supplier-panel"><h2>Pemasok</h2><form id="supplier-form" class="row"><label>Nama pemasok<input name="name" required minlength="2" maxlength="120"></label><label>WhatsApp<input name="phone" maxlength="30"></label><label>Email<input name="email" type="email" maxlength="254"></label><button class="button" type="submit">Tambah pemasok</button></form></section>
      <section class="panel"><h2>Pergerakan stok terbaru</h2><div class="list" id="movements"></div></section>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/supabase-config.js"></script><script src="/admin-tools.js?v=2"></script>
  <script>
    (async function(){
      const $=function(id){return document.getElementById(id)},status=$('status');let context,products=[];
      function populateSelect(selectId,includeBlank){const select=$(selectId);select.replaceChildren();if(includeBlank){const blank=document.createElement('option');blank.value='';blank.textContent='Pilih produk';select.append(blank)}products.filter(function(item){return item.is_active}).forEach(function(product){const option=document.createElement('option');option.value=product.id;option.textContent=product.name+' · stok '+product.stock_quantity;select.append(option)})}
      function renderProducts(){
        const target=$('products');target.replaceChildren();if(!products.length){target.textContent='Belum ada produk.';return}
        products.forEach(function(product){const card=document.createElement('article');card.className='item';const title=document.createElement('strong');title.textContent=product.name+(product.stock_quantity<=product.minimum_stock?' · PERLU RESTOCK':'');if(product.stock_quantity<=product.minimum_stock)title.className='low';
          const meta=document.createElement('small');meta.textContent=[product.sku||'Tanpa SKU',product.category,product.stock_quantity+' '+product.unit+' (minimum '+product.minimum_stock+')','jual '+window.GembulStaff.rupiah(product.selling_price)].join(' · ');
          const edit=document.createElement('button');edit.type='button';edit.className='button';edit.textContent='Ubah harga / detail';edit.style.marginTop='8px';edit.hidden=context.role!=='owner';edit.addEventListener('click',function(){const form=$('product-form');form.elements.id.value=product.id;form.elements.name.value=product.name;form.elements.sku.value=product.sku||'';form.elements.category.value=product.category;form.elements.unit.value=product.unit;form.elements.purchase_price.value=product.purchase_price;form.elements.selling_price.value=product.selling_price;form.elements.minimum_stock.value=product.minimum_stock;form.elements.is_active.value=String(product.is_active);$('product-panel').hidden=false;$('product-panel').scrollIntoView({behavior:'smooth'})});card.append(title,meta,edit);target.append(card)});
      }
      async function load(){
        try{products=await window.GembulStaff.call(context.client,'admin_inventory_products');const report=await window.GembulStaff.call(context.client,'admin_inventory_report');$('product-count').textContent=report.product_count;$('inventory-value').textContent=window.GembulStaff.rupiah(report.inventory_value);$('low-count').textContent=report.low_stock.length;renderProducts();populateSelect('purchase-product',true);populateSelect('adjust-product',true);
          const low=report.low_stock.map(function(item){return item.name+' ('+item.stock+'/'+item.minimum_stock+')'});if(low.length)window.GembulStaff.setStatus(status,'Stok rendah: '+low.join(', '),false);else window.GembulStaff.setStatus(status,'Inventori berhasil dimuat.',false);
          const movementTarget=$('movements');movementTarget.replaceChildren();report.recent_movements.forEach(function(item){const row=document.createElement('div');row.className='item';const title=document.createElement('strong');title.textContent=item.product+' · '+item.type+' '+item.quantity;const meta=document.createElement('small');meta.textContent=(item.note||'Tanpa catatan')+' · '+new Date(item.created_at).toLocaleString('id-ID');row.append(title,meta);movementTarget.append(row)});if(!report.recent_movements.length)movementTarget.textContent='Belum ada pergerakan stok.';
        }catch(error){window.GembulStaff.setStatus(status,error.message||'Inventori gagal dimuat.',true)}
      }
      $('new-product').addEventListener('click',function(){$('product-form').reset();$('product-form').elements.id.value='';$('product-panel').hidden=false});
      $('product-form').addEventListener('submit',async function(event){event.preventDefault();const form=event.currentTarget,data=new FormData(form);try{await window.GembulStaff.call(context.client,'admin_save_product',{p_product_id:data.get('id')||null,p_name:data.get('name'),p_sku:data.get('sku')||null,p_category:data.get('category'),p_unit:data.get('unit'),p_purchase_price:Number(data.get('purchase_price')),p_selling_price:Number(data.get('selling_price')),p_minimum_stock:Number(data.get('minimum_stock')),p_is_active:data.get('is_active')==='true'});window.GembulStaff.setStatus(status,'Produk berhasil disimpan.',false);await load()}catch(error){window.GembulStaff.setStatus(status,error.message||'Produk gagal disimpan.',true)}});
      $('purchase-form').addEventListener('submit',async function(event){event.preventDefault();const form=event.currentTarget,data=new FormData(form);try{const result=await window.GembulStaff.call(context.client,'admin_receive_purchase',{p_supplier_id:$('supplier-select').value||null,p_notes:data.get('notes')||'',p_items:[{product_id:$('purchase-product').value,quantity:Number(data.get('quantity')),unit_cost:Number(data.get('unit_cost'))}]});window.GembulStaff.setStatus(status,'Pembelian '+result.purchase_number+' diterima · '+window.GembulStaff.rupiah(result.total),false);form.reset();await load()}catch(error){window.GembulStaff.setStatus(status,error.message||'Pembelian gagal dicatat.',true)}});
      $('adjust-form').addEventListener('submit',async function(event){event.preventDefault();const form=event.currentTarget,data=new FormData(form);try{await window.GembulStaff.call(context.client,'admin_adjust_inventory',{p_product_id:$('adjust-product').value,p_quantity:Number(data.get('quantity')),p_movement_type:data.get('type'),p_note:data.get('note')});window.GembulStaff.setStatus(status,'Stok berhasil diperbarui.',false);form.reset();await load()}catch(error){window.GembulStaff.setStatus(status,error.message||'Penyesuaian stok gagal.',true)}});
      $('supplier-form').addEventListener('submit',async function(event){event.preventDefault();const data=new FormData(event.currentTarget);try{const id=await window.GembulStaff.call(context.client,'admin_save_supplier',{p_id:null,p_name:data.get('name'),p_phone:data.get('phone')||null,p_email:data.get('email')||null,p_notes:null});const option=document.createElement('option');option.value=id;option.textContent=data.get('name');$('supplier-select').append(option);event.currentTarget.reset();window.GembulStaff.setStatus(status,'Pemasok berhasil ditambahkan.',false)}catch(error){window.GembulStaff.setStatus(status,error.message||'Pemasok gagal disimpan.',true)}});
      $('logout').addEventListener('click',async function(){const result=await context.client.auth.signOut();if(result.error)window.GembulStaff.setStatus(status,result.error.message,true);else window.location.replace('/account.html')});
      try{context=await window.GembulStaff.requireStaff(false);if(context){$('inventory').hidden=false;$('product-panel').hidden=context.role!=='owner';await load();const suppliers=await window.GembulStaff.call(context.client,'admin_list_suppliers');suppliers.forEach(function(supplier){const option=document.createElement('option');option.value=supplier.id;option.textContent=supplier.name;$('supplier-select').append(option)})}}catch(error){window.GembulStaff.setStatus(status,error.message||'Inventori gagal dibuka.',true)}
    })();
  </script>
</body>
</html>
